<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LRS Demo">
<meta name="theme-color" content="#102d45">
<title>LRS Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ===== LRS huisstijl ===== */
  :root {
    --navy: #183f62;
    --navy-deep: #102d45;
    --navy-dark: #0b2236;
    --teal: #5f8a94;
    --yellow: #faeb4e;
    --white: #ffffff;
    --muted: rgba(255,255,255,.62);
    --radius: 22px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--navy-deep);
    color: var(--white);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden;
    position: relative;
    padding: max(30px, env(safe-area-inset-top)) max(36px, env(safe-area-inset-right))
             max(30px, env(safe-area-inset-bottom)) max(36px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 30px;
  }

  /* Kleurvervaging zoals op de website */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 80% at -8% 80%, rgba(95,138,148,.95), transparent 72%),
      radial-gradient(45% 50% at 0% 10%, rgba(95,138,148,.45), transparent 70%),
      radial-gradient(50% 60% at 105% 0%, rgba(24,63,98,.9), transparent 70%),
      linear-gradient(180deg, var(--navy-deep), var(--navy-dark));
  }

  /* ===== Header ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .logo {
    background: var(--navy);
    border-radius: 16px 16px 0 16px;
    padding: 14px 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    display: flex;
  }
  .logo img { height: 58px; width: auto; display: block; }

  .title { text-align: right; }
  .kicker {
    color: var(--yellow); font-weight: 800; font-size: 13px; letter-spacing: 1.5px;
    text-transform: uppercase; display: inline-flex; align-items: center; gap: 10px;
  }
  .kicker::before { content: ""; width: 28px; height: 2px; background: var(--yellow); }
  h1 {
    margin: 6px 0 0; font-weight: 900; font-size: 46px; line-height: 1;
    letter-spacing: -.5px; text-transform: uppercase;
  }
  h1 .outline { color: transparent; -webkit-text-stroke: 1.5px var(--yellow); }

  /* ===== Tegels ===== */
  .grid {
    flex: 1; min-height: 0;
    display: grid; gap: 22px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  @media (orientation: portrait) {
    .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
    h1 { font-size: 38px; }
  }

  .tile {
    position: relative;
    border: 0; padding: 26px;
    border-radius: var(--radius) var(--radius) 0 var(--radius);
    background: linear-gradient(155deg, #1f4b72 0%, var(--navy) 55%, #143656 100%);
    color: var(--white); font: inherit; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    cursor: pointer; overflow: hidden;
    box-shadow:
      0 2px 4px rgba(0,0,0,.18),
      0 14px 28px rgba(0,0,0,.28),
      0 30px 60px rgba(5,20,35,.35),
      inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .18s ease, box-shadow .18s ease, background .3s ease, color .3s ease;
  }
  .tile:active {
    transform: translateY(3px) scale(.98);
    box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 6px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .tile .num {
    font-weight: 900; font-size: 64px; line-height: .9;
    color: transparent; -webkit-text-stroke: 1.5px var(--yellow);
    transition: -webkit-text-stroke-color .3s ease;
  }
  .tile .bottom { width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .tile .label { font-weight: 800; font-size: 21px; line-height: 1.15; text-transform: uppercase; letter-spacing: .2px; }
  .tile .sub { font-weight: 500; font-size: 14px; color: var(--muted); margin-top: 6px; transition: color .3s ease; }
  .tile .arrow {
    flex: none; width: 46px; height: 46px; border-radius: 14px 14px 0 14px;
    background: var(--yellow); color: var(--navy);
    display: grid; place-items: center;
    transition: background .3s ease, color .3s ease, transform .3s ease;
  }
  .tile .arrow svg { width: 20px; height: 20px; }

  /* Rimpel bij aanraken */
  .ripple {
    position: absolute; border-radius: 50%; background: var(--yellow); opacity: .35;
    transform: scale(0); pointer-events: none; animation: ripple .6s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* Bezig */
  .tile.busy .arrow { animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.85); opacity: .6; } }

  /* Geactiveerd: tegel wordt geel */
  .tile.ok { background: var(--yellow); color: var(--navy); }
  .tile.ok .num { -webkit-text-stroke-color: var(--navy); }
  .tile.ok .sub { color: rgba(24,63,98,.75); }
  .tile.ok .arrow { background: var(--navy); color: var(--yellow); }

  .tile.err { box-shadow: 0 0 0 3px #ff6b6b, 0 14px 28px rgba(0,0,0,.28); }

  /* ===== Melding ===== */
  .toast {
    position: fixed; left: 50%; bottom: max(30px, env(safe-area-inset-bottom));
    transform: translate(-50%, 200%); opacity: 0;
    background: var(--yellow); color: var(--navy);
    padding: 16px 26px; border-radius: 16px 16px 0 16px;
    font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .5px;
    box-shadow: 0 16px 40px rgba(0,0,0,.4);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.error { background: #ff6b6b; color: #fff; }
</style>
</head>
<body>

  <div class="title">
    <div class="kicker">Tik op een scène</div>
    <h1>Live <span class="outline">demo</span></h1>
  </div>
</header>

<main class="grid" id="grid"></main>

<div class="toast" id="toast"></div>

<script>
/* ===== Pas hier de namen van de knoppen aan ===== */
const buttons = [
  { label: "Scène 1", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/D8A3KN2WER2CC6A7EB455KXH3SANA2BA" },
  { label: "Scène 2", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/FWCUUPQQBBJYV3NCEAKNNJ5ZTCNMN7FS" },
  { label: "Scène 3", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/8RJR7YDUEN2ZT3HKHF2AAJS4BVN4Y3UU" },
  { label: "Scène 4", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/Q4HQW2RVVR8DSMRBJWN6MHYB4AUTPPX8" },
  { label: "Scène 5", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/JYVJ7HVAMP748SYQRPBKWKN7URVJYFRU" },
  { label: "Scène 6", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/XC73DJ5E4HM6R32ARPXMQRRSVVYKPWMB" },
  { label: "Scène 7", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/KJ5D5SKFDE7YDSFYPVHXYDJBAAEPRBEV" },
  { label: "Scène 8", sub: "Tik om te starten", url: "https://t1s.gobright.cloud/api/v1.0/Webhook/Execution/7W5NMRSFP8JQJSVPKEYMZXNAHTB6TUEY" }
];

const grid = document.getElementById("grid");
const toast = document.getElementById("toast");
let toastTimer;
const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.classList.toggle("error", !!isError);
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function ripple(tile, e) {
  const r = tile.getBoundingClientRect();
  const size = Math.max(r.width, r.height) / 2;
  const x = (e.clientX || r.left + r.width / 2) - r.left - size / 2;
  const y = (e.clientY || r.top + r.height / 2) - r.top - size / 2;
  const s = document.createElement("span");
  s.className = "ripple";
  s.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  tile.appendChild(s);
  setTimeout(() => s.remove(), 650);
}

buttons.forEach((b, i) => {
  const tile = document.createElement("button");
  tile.className = "tile";
  tile.innerHTML = `
    <span class="num">${String(i + 1).padStart(2, "0")}</span>
    <span class="bottom">
      <span><div class="label">${b.label}</div><div class="sub">${b.sub}</div></span>
      <span class="arrow">${arrowSvg}</span>
    </span>`;

  tile.addEventListener("click", async (e) => {
    if (tile.classList.contains("busy")) return;
    ripple(tile, e);
    tile.classList.remove("ok", "err");
    tile.classList.add("busy");
    try {
      await fetch(b.url, { method: "GET", mode: "no-cors", cache: "no-store" });
      tile.classList.replace("busy", "ok");
      showToast(`${b.label} geactiveerd`);
    } catch (err) {
      tile.classList.replace("busy", "err");
      showToast(`${b.label} mislukt – controleer verbinding`, true);
    }
    setTimeout(() => tile.classList.remove("ok", "err"), 2500);
  });

  grid.appendChild(tile);
});

/* Dubbeltik-zoom op iPad voorkomen */
let lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouch < 350) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
</body>
</html>
